<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - TechShop</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #131315; color: #e0e0f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .card { background: #1c1c26; border: 1px solid #2a3b3c; border-radius: 20px; padding: 48px; width: 100%; max-width: 420px; box-shadow: 0 24px 80px rgba(0,219,233,0.08); }
        .logo { font-size: 26px; font-weight: 800; color: #fff; text-align: center; margin-bottom: 6px; }
        .logo span { color: #00dbe9; }
        .sub { text-align: center; color: #7a9a9b; font-size: 14px; margin-bottom: 32px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #7a9a9b; margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="email"], input[type="password"] { width: 100%; background: #0e0e10; border: 1px solid #2a3b3c; color: #e0e0f0; padding: 11px 14px; border-radius: 10px; font-size: 14px; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #00dbe9; }
        .error-msg { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.25); color: #f87171; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 18px; text-align: center; }
        .info-msg { background: rgba(0,219,233,0.08); border: 1px solid rgba(0,219,233,0.25); color: #00dbe9; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 18px; text-align: center; }
        .btn { width: 100%; padding: 13px; background: #00dbe9; color: #002022; border: none; border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .btn:hover { background: #00bfcc; transform: translateY(-1px); box-shadow: 0 0 20px rgba(0,219,233,0.4); }
        .link-row { text-align: center; margin-top: 16px; font-size: 13px; color: #7a9a9b; }
        .link-row a { color: #00dbe9; text-decoration: none; }
        .link-row a:hover { text-decoration: underline; }
        .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: #2a3b3c; font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #2a3b3c; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">Tech<span>Shop</span></div>
    <div class="sub">Hesabına giriş yap</div>

    {{if .Error}}<div class="error-msg">⚠️ {{.Error}}</div>{{end}}
    {{if .Info}}<div class="info-msg">ℹ️ {{.Info}}</div>{{end}}

    <form method="POST" action="/musteri/giris">
        {{if .Redirect}}<input type="hidden" name="redirect" value="{{.Redirect}}">{{end}}
        <div class="form-group">
            <label>E-posta</label>
            <input type="email" name="email" placeholder="ahmet@ornek.com" required autocomplete="email">
        </div>
        <div class="form-group">
            <label>Şifre</label>
            <input type="password" name="sifre" placeholder="••••••" required>
        </div>
        <button type="submit" class="btn">Giriş Yap →</button>
    </form>

    <div class="divider">ya da</div>
    <div class="link-row">Hesabın yok mu? <a href="/musteri/kayit">Kayıt ol</a></div>
    <div class="link-row" style="margin-top:10px"><a href="/">← Ana sayfaya dön</a></div>
</div>
</body>
</html>
