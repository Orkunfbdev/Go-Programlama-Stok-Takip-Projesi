<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Girişi - TechShop</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #e0e0f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #12122a;
            border: 1px solid #2a2a5a;
            border-radius: 20px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 80px rgba(108,99,255,0.15);
        }

        .login-logo {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            text-align: center;
            margin-bottom: 8px;
        }
        .login-logo span { color: #6c63ff; }

        .login-sub {
            text-align: center;
            color: #6a6a9a;
            font-size: 14px;
            margin-bottom: 36px;
        }

        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #a0a0c0; margin-bottom: 8px; }
        input[type="text"], input[type="password"] {
            width: 100%;
            background: #1e1e40;
            border: 1px solid #3a3a6a;
            color: #e0e0f0;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #6c63ff; }

        .error-msg {
            background: rgba(255,85,85,0.1);
            border: 1px solid rgba(255,85,85,0.3);
            color: #ff7070;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: center;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: #6c63ff;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
        }
        .btn-login:hover { background: #574fd6; transform: translateY(-1px); }
        .btn-login:active { transform: translateY(0); }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6a6a9a;
            font-size: 13px;
            text-decoration: none;
        }
        .back-link:hover { color: #a0a0c0; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-logo">Tech<span>Store</span></div>
    <div class="login-sub">Admin Paneline Giriş</div>

    {{if .}}
    <div class="error-msg">⚠️ {{.}}</div>
    {{end}}

    <form method="POST" action="/login">
        <div class="form-group">
            <label>Kullanıcı Adı</label>
            <input type="text" name="username" placeholder="admin" autocomplete="off" required>
        </div>
        <div class="form-group">
            <label>Şifre</label>
            <input type="password" name="password" placeholder="••••" required>
        </div>
        <button type="submit" class="btn-login">Giriş Yap →</button>
    </form>

    <a href="/" class="back-link">← Ana sayfaya dön</a>
</div>

</body>
</html>
